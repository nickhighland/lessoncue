<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LessonCue Demo</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #000; overflow: hidden; }
    body { display: grid; place-items: center; font-family: Arial, sans-serif; }
    video { display: block; width: 100vw; height: 100vh; object-fit: contain; background: #000; }
    #status { position: fixed; left: 50%; bottom: 7vh; transform: translateX(-50%); color: #f6f1e4; background: #071817dd; border: 1px solid #6e9586; border-radius: 999px; padding: 12px 22px; font-size: 20px; opacity: 0; transition: opacity .2s; }
    #status.visible { opacity: 1; }
  </style>
</head>
<body>
  <video id="demo-video" controls autoplay playsinline preload="auto">
    <source src="./lessoncue-demo.mp4" type="video/mp4">
  </video>
  <div id="status" role="status">Press Select to play the demo video.</div>
  <script>
    const video = document.getElementById('demo-video');
    const status = document.getElementById('status');
    const showStatus = message => {
      status.textContent = message;
      status.classList.add('visible');
    };
    const hideStatus = () => status.classList.remove('visible');
    const start = () => {
      const result = video.play();
      if (result && typeof result.catch === 'function') {
        result.catch(() => showStatus('Press Select to play the demo video.'));
      }
    };
    video.addEventListener('playing', hideStatus);
    video.addEventListener('error', () => showStatus('The bundled demo video could not be opened.'));
    video.addEventListener('ended', () => {
      video.currentTime = 0;
      start();
    });
    window.addEventListener('load', start);
  </script>
</body>
</html>
