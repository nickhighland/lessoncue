name: Build all apps

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  TRIVY_VERSION: 0.72.0
  TRIVY_LINUX_X64_SHA256: bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:protocol
      - run: npm run lint
      - run: npm test

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:admin
      - run: bash -n installers/linux/install-latest.sh installers/linux/install.sh installers/linux/uninstall.sh installers/linux/lessoncue-update
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore server/LessonCue.Server.Tests/LessonCue.Server.Tests.csproj
      - run: dotnet test server/LessonCue.Server.Tests/LessonCue.Server.Tests.csproj -c Release --no-restore
      - run: dotnet publish server/LessonCue.Server/LessonCue.Server.csproj -c Release -o artifacts/server
      - uses: actions/upload-artifact@v4
        with:
          name: lessoncue-server-portable
          path: artifacts/server

  linux-updater-transaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise update, failure rollback, operator rollback, and boot recovery
        run: >-
          docker run --rm
          -v "${PWD}:/workspace:ro"
          debian:trixie-slim
          bash /workspace/tests/linux-updater-transaction.sh /workspace

  linux-media-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise filesystem, network, and time isolation
        run: sudo bash tests/linux-media-worker.sh "${PWD}"

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap ffmpeg libreoffice-impress poppler-utils
      - name: Install media worker for browser validation
        run: sudo install -D -m 0755 installers/linux/lessoncue-media-worker /usr/local/libexec/lessoncue-media-worker
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:admin
      - name: Run browser tests
        env:
          LESSONCUE_E2E_RUN_AS_ROOT: "1"
        run: npm run test:e2e

  android-tv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.1
      - run: >-
          gradle -p android-tv
          :app:testSideloadDebugUnitTest :app:testStoreDebugUnitTest
          :app:lintSideloadDebug :app:lintStoreDebug
          :app:assembleSideloadDebug :app:assembleStoreDebug
          :app:assembleSideloadDebugAndroidTest :app:assembleStoreDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: LessonCue-AndroidTV-debug
          path: |
            android-tv/app/build/outputs/apk/sideload/debug/app-sideload-debug.apk
            android-tv/app/build/outputs/apk/store/debug/app-store-debug.apk

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows installer scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($path in @('installers/windows/Install-LessonCue.ps1', 'installers/windows/Uninstall-LessonCue.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$path`: $($_.Message)" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/LessonCue.Server/Dockerfile
          push: false
          load: true
          tags: lessoncue/server:ci
      - name: Install checksum-pinned Trivy
        run: bash scripts/install-trivy.sh "${RUNNER_TEMP}/lessoncue-security"
      - name: Scan tracked source for secrets and insecure configuration
        run: |
          "${RUNNER_TEMP}/lessoncue-security/trivy" fs \
            --scanners misconfig,secret \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --skip-dirs .git \
            .
      - name: Scan the exact container image
        run: |
          "${RUNNER_TEMP}/lessoncue-security/trivy" image \
            --scanners vuln,misconfig,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            lessoncue/server:ci
