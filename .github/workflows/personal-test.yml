name: Build Google Play personal test

on:
  workflow_dispatch:
  push:
    branches:
      - codex/google-play-personal-test-demo
    paths:
      - .github/workflows/personal-test.yml
      - android-tv/settings.gradle.kts
      - android-tv/personal-test/**

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      LESSONCUE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
      LESSONCUE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      LESSONCUE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.1
      - name: Load LessonCue signing identity
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          test -n "${SIGNING_KEY_BASE64}" || { echo "::error::ANDROID_SIGNING_KEY_BASE64 is not configured"; exit 1; }
          test -n "${LESSONCUE_ANDROID_KEYSTORE_PASSWORD}" || { echo "::error::ANDROID_SIGNING_KEYSTORE_PASSWORD is not configured"; exit 1; }
          test -n "${LESSONCUE_ANDROID_KEY_ALIAS}" || { echo "::error::ANDROID_SIGNING_KEY_ALIAS is not configured"; exit 1; }
          test -n "${LESSONCUE_ANDROID_KEY_PASSWORD}" || { echo "::error::ANDROID_SIGNING_KEY_PASSWORD is not configured"; exit 1; }
          test -n "${SIGNING_CERT_SHA256}" || { echo "::error::ANDROID_SIGNING_CERT_SHA256 is not configured"; exit 1; }
          printf '%s' "${SIGNING_KEY_BASE64}" | base64 --decode > "${RUNNER_TEMP}/lessoncue-release.jks"
          chmod 0600 "${RUNNER_TEMP}/lessoncue-release.jks"
          echo "LESSONCUE_ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/lessoncue-release.jks" >> "${GITHUB_ENV}"
          echo "LESSONCUE_ANDROID_SIGNING_CERT_SHA256=${SIGNING_CERT_SHA256}" >> "${GITHUB_ENV}"
      - name: Test and build signed closed-test bundle
        run: >-
          gradle -p android-tv
          :personal-test:testDebugUnitTest
          :personal-test:lintDebug
          :personal-test:bundleRelease
      - name: Verify and name bundle
        run: |
          bundle="android-tv/personal-test/build/outputs/bundle/release/personal-test-release.aab"
          test -f "${bundle}" || { echo "::error::The signed closed-test bundle was not produced"; exit 1; }
          jarsigner -verify "${bundle}"
          actual_fingerprint="$(keytool -printcert -jarfile "${bundle}" | awk -F'SHA256: ' '/SHA256:/ { print toupper($2); exit }' | tr -d ':[:space:]')"
          expected_fingerprint="$(printf '%s' "${LESSONCUE_ANDROID_SIGNING_CERT_SHA256}" | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          test -n "${actual_fingerprint}" || { echo "::error::Unable to read the AAB signing certificate fingerprint"; exit 1; }
          test "${actual_fingerprint}" = "${expected_fingerprint}" || { echo "::error::Closed-test AAB signing certificate does not match ANDROID_SIGNING_CERT_SHA256"; exit 1; }
          cp "${bundle}" LessonCue-Google-Play-Closed-Test.aab
      - uses: actions/upload-artifact@v4
        with:
          name: LessonCue-Google-Play-Closed-Test
          path: LessonCue-Google-Play-Closed-Test.aab
          if-no-files-found: error
          retention-days: 30
