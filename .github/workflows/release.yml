name: Package release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and publish
        required: true
        default: v0.46.16
        type: string
      reuse_run_id:
        description: Completed release-validation run whose artifacts should be published
        required: false
        default: ''
        type: string
      release_scope:
        description: Automatically detect whether this release needs TV artifacts; server-only is allowed only when no TV paths changed
        required: false
        default: auto
        type: choice
        options: [auto, server-only, tv]

permissions:
  contents: read

env:
  YT_DLP_VERSION: 2026.08.19
  DENO_VERSION: 2.9.7
  DENO_LINUX_X64_SHA256: c6527f24f4b16031d3ae4fa9f658d5f11534c8d84ce7dc8502420280919c3490
  DENO_LINUX_ARM64_SHA256: c832298b1ad4422481334855f6003e0f54145762c5a134f20a489511d2f65bbf
  DENO_WINDOWS_X64_SHA256: a0c3101b4158d1dfb7d6a78a7bf0f3de80c96bb423c152beec8beb22786f2238
  TRIVY_VERSION: 0.72.0
  TRIVY_LINUX_X64_SHA256: bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  release-scope:
    runs-on: ubuntu-latest
    outputs:
      tv_app_required: ${{ steps.scope.outputs.tv_app_required }}
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify release scope
        id: scope
        env:
          RELEASE_SCOPE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.release_scope || 'auto' }}
        run: |
          current_tag="${RELEASE_TAG}"
          base_tag="$(git tag --sort=-version:refname | awk -v current="${current_tag}" '$0 != current && $0 ~ /^v[0-9]/ { print; exit }')"
          if [ -z "${base_tag}" ]; then
            echo "::error::Could not find a previous version tag to classify the release against."
            exit 1
          fi
          result="$(node scripts/release-scope.mjs "${base_tag}" "${GITHUB_SHA}")"
          echo "${result}" | jq .
          detected_tv="$(echo "${result}" | jq -r '.tvAppRequired')"
          requested="${RELEASE_SCOPE_INPUT:-auto}"
          case "${requested}" in
            auto)
              tv_required="${detected_tv}"
              resolved_scope="$([ "${tv_required}" = true ] && echo tv || echo server-only)"
              ;;
            server-only)
              if [ "${detected_tv}" = true ]; then
                echo "::error::release_scope=server-only is unsafe because TV-app or protocol paths changed."
                exit 1
              fi
              tv_required=false
              resolved_scope=server-only
              ;;
            tv)
              tv_required=true
              resolved_scope=tv
              ;;
            *)
              echo "::error::Unknown release scope: ${requested}"
              exit 64
              ;;
          esac
          echo "tv_app_required=${tv_required}" >> "${GITHUB_OUTPUT}"
          echo "scope=${resolved_scope}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Release scope"
            echo
            echo "- Previous tag: \`${base_tag}\`"
            echo "- Requested scope: \`${requested}\`"
            echo "- Resolved scope: \`${resolved_scope}\`"
            echo "- TV artifact required: \`${tv_required}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  release-validation:
    needs: release-scope
    if: ${{ needs['release-scope'].result == 'success' && inputs.reuse_run_id == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libreoffice-impress poppler-utils
      - name: Install media worker for browser validation
        run: sudo install -D -m 0755 installers/linux/lessoncue-media-worker /usr/local/libexec/lessoncue-media-worker
      - run: npm ci
      - run: npm run test:protocol
      - run: npm run test:network-config
      - run: npm run test:amazon
      - run: npm run lint
      - run: npm test
      - run: dotnet restore server/LessonCue.Server.Tests/LessonCue.Server.Tests.csproj
      - run: dotnet test server/LessonCue.Server.Tests/LessonCue.Server.Tests.csproj -c Release --no-restore
      - run: |
          for script in installers/linux/install-latest.sh installers/linux/install.sh installers/linux/uninstall.sh installers/linux/lessoncue-update installers/linux/repair-updater.sh scripts/remove-shlink-web-client.sh tests/linux-updater-transaction.sh; do
            bash -n "$script"
          done
      - name: Exercise transactional Linux updates before packaging
        run: >-
          docker run --rm
          -v "${PWD}:/workspace:ro"
          debian:trixie-slim
          bash /workspace/tests/linux-updater-transaction.sh /workspace
      - name: Exercise media-worker isolation before packaging
        run: >-
          docker run --rm --privileged
          -v "${PWD}:/workspace:ro"
          debian:trixie-slim
          bash /workspace/tests/linux-media-worker.sh /workspace
      - run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:e2e
      - run: docker build -f server/LessonCue.Server/Dockerfile -t lessoncue/server:release-validation .
      - name: Install checksum-pinned Trivy
        run: bash scripts/install-trivy.sh "${RUNNER_TEMP}/lessoncue-security"
      - name: Scan source, dependencies, configuration, and secrets
        run: |
          "${RUNNER_TEMP}/lessoncue-security/trivy" fs \
            --scanners vuln,misconfig,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --skip-dirs .git \
            .
          "${RUNNER_TEMP}/lessoncue-security/trivy" image \
            --scanners vuln,misconfig,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            lessoncue/server:release-validation

  server-linux:
    needs: [release-scope, release-validation]
    if: ${{ needs['release-scope'].result == 'success' && needs['release-validation'].result == 'success' && inputs.reuse_run_id == '' }}
    strategy:
      matrix:
        runtime: [linux-x64, linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:admin
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish server/LessonCue.Server/LessonCue.Server.csproj -c Release -r ${{ matrix.runtime }} --self-contained -o package/payload
      - name: Bundle YouTube importer
        run: |
          if [ "${{ matrix.runtime }}" = "linux-arm64" ]; then
            asset=yt-dlp_linux_aarch64
            expected=b16e4dab368a816cd05d477d698a605a6ae87ccee1c8ffd38fa21d7254141fcc
            deno_asset=deno-aarch64-unknown-linux-gnu.zip
            deno_expected=${DENO_LINUX_ARM64_SHA256}
          else
            asset=yt-dlp_linux
            expected=58162f9bfdc27458ea47bfcb311cf47028f17d8154a8bf7d689861d46399230a
            deno_asset=deno-x86_64-unknown-linux-gnu.zip
            deno_expected=${DENO_LINUX_X64_SHA256}
          fi
          curl -fL "https://github.com/yt-dlp/yt-dlp/releases/download/${YT_DLP_VERSION}/${asset}" -o package/payload/yt-dlp
          printf '%s  %s\n' "${expected}" package/payload/yt-dlp | sha256sum -c -
          chmod 0755 package/payload/yt-dlp
          if [ "${{ matrix.runtime }}" = "linux-arm64" ]; then
            file package/payload/yt-dlp | grep -Eq 'ELF 64-bit.*ARM aarch64'
          else
            test "$(package/payload/yt-dlp --version)" = "${YT_DLP_VERSION}"
          fi
          curl -fL "https://github.com/denoland/deno/releases/download/v${DENO_VERSION}/${deno_asset}" -o package/payload/deno.zip
          printf '%s  %s\n' "${deno_expected}" package/payload/deno.zip | sha256sum -c -
          unzip -p package/payload/deno.zip deno > package/payload/deno
          rm package/payload/deno.zip
          chmod 0755 package/payload/deno
          if [ "${{ matrix.runtime }}" = "linux-arm64" ]; then
            file package/payload/deno | grep -Eq 'ELF 64-bit.*ARM aarch64'
          else
            test "$(package/payload/deno --version | sed -n '1s/^deno \([^ ]*\).*/\1/p')" = "${DENO_VERSION}"
          fi
      - run: |
          cp installers/linux/install.sh installers/linux/uninstall.sh installers/linux/repair-updater.sh installers/linux/lessoncue.service installers/linux/lessoncue-cloudflared.service installers/linux/lessoncue-update installers/linux/lessoncue-update.service installers/linux/lessoncue-update.path installers/linux/lessoncue-update-recovery.service installers/linux/lessoncue-media-worker installers/linux/lessoncue-render.rules installers/release-signing-public.pem package/
          cp installers/linux/lessoncue-media-worker package/payload/lessoncue-media-worker
          chmod 0755 package/payload/lessoncue-media-worker
          test -x package/lessoncue-media-worker
          test -x package/payload/lessoncue-media-worker
          test -f package/lessoncue-render.rules
      - run: mkdir -p package/docker
      - run: cp docker/avahi-service.xml package/docker/
      - name: Create normalized Linux archive
        run: |
          source_date_epoch="$(git log -1 --format=%ct)"
          tar \
            --sort=name \
            --mtime="@${source_date_epoch}" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C package \
            -czf LessonCue-Server-${{ matrix.runtime }}.tar.gz \
            .
      - uses: actions/upload-artifact@v4
        with:
          name: LessonCue-Server-${{ matrix.runtime }}
          path: LessonCue-Server-${{ matrix.runtime }}.tar.gz

  server-windows:
    needs: [release-scope, release-validation]
    if: ${{ needs['release-scope'].result == 'success' && needs['release-validation'].result == 'success' && inputs.reuse_run_id == '' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows installer scripts
        shell: pwsh
        run: |
          foreach ($path in @('installers/windows/Install-LessonCue.ps1', 'installers/windows/Uninstall-LessonCue.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$path`: $($_.Message)" }
              exit 1
            }
          }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:admin
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish server/LessonCue.Server/LessonCue.Server.csproj -c Release -r win-x64 --self-contained -o package/payload
      - shell: pwsh
        run: |
          $expected = "66674953fe251b89f4d08c5f0e35e0728679bd67ab3d7d05c0562af101dd3e7a"
          Invoke-WebRequest "https://github.com/yt-dlp/yt-dlp/releases/download/$env:YT_DLP_VERSION/yt-dlp.exe" -OutFile package/payload/yt-dlp.exe
          $actual = (Get-FileHash package/payload/yt-dlp.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "yt-dlp.exe checksum mismatch" }
          if ((& package/payload/yt-dlp.exe --version) -ne $env:YT_DLP_VERSION) { throw "yt-dlp.exe version mismatch" }
          $denoExpected = $env:DENO_WINDOWS_X64_SHA256
          Invoke-WebRequest "https://github.com/denoland/deno/releases/download/v$env:DENO_VERSION/deno-x86_64-pc-windows-msvc.zip" -OutFile package/deno.zip
          $denoActual = (Get-FileHash package/deno.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($denoActual -ne $denoExpected) { throw "deno.zip checksum mismatch" }
          Expand-Archive package/deno.zip -DestinationPath package/deno-extracted -Force
          Move-Item package/deno-extracted/deno.exe package/payload/deno.exe
          Remove-Item package/deno.zip -Force
          Remove-Item package/deno-extracted -Recurse -Force
          $denoVersion = ((& package/payload/deno.exe --version | Select-Object -First 1) -split '\s+')[1]
          if ($denoVersion -ne $env:DENO_VERSION) { throw "Deno version mismatch" }
          Copy-Item installers/windows/Install-LessonCue.ps1 package/
          Copy-Item installers/windows/Uninstall-LessonCue.ps1 package/
          Compress-Archive -Path package/* -DestinationPath LessonCue-Server-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LessonCue-Server-Windows-x64
          path: LessonCue-Server-Windows-x64.zip

  android:
    needs: [release-scope, release-validation]
    if: ${{ needs['release-scope'].result == 'success' && needs['release-validation'].result == 'success' && needs['release-scope'].outputs.tv_app_required == 'true' && inputs.reuse_run_id == '' }}
    runs-on: ubuntu-latest
    env:
      LESSONCUE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
      LESSONCUE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      LESSONCUE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.1
      - name: Require production Android signing material
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          test -n "${SIGNING_KEY_BASE64}" || { echo "::error::ANDROID_SIGNING_KEY_BASE64 is not configured"; exit 1; }
          test -n "${LESSONCUE_ANDROID_KEYSTORE_PASSWORD}" || { echo "::error::ANDROID_SIGNING_KEYSTORE_PASSWORD is not configured"; exit 1; }
          test -n "${LESSONCUE_ANDROID_KEY_ALIAS}" || { echo "::error::ANDROID_SIGNING_KEY_ALIAS is not configured"; exit 1; }
          test -n "${LESSONCUE_ANDROID_KEY_PASSWORD}" || { echo "::error::ANDROID_SIGNING_KEY_PASSWORD is not configured"; exit 1; }
          test -n "${SIGNING_CERT_SHA256}" || { echo "::error::ANDROID_SIGNING_CERT_SHA256 is not configured"; exit 1; }
          printf '%s' "${SIGNING_KEY_BASE64}" | base64 --decode > "${RUNNER_TEMP}/lessoncue-release.jks"
          chmod 0600 "${RUNNER_TEMP}/lessoncue-release.jks"
          echo "LESSONCUE_ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/lessoncue-release.jks" >> "${GITHUB_ENV}"
          echo "LESSONCUE_ANDROID_SIGNING_CERT_SHA256=${SIGNING_CERT_SHA256}" >> "${GITHUB_ENV}"
      - run: >-
          gradle -p android-tv
          :app:testSideloadDebugUnitTest :app:testStoreDebugUnitTest
          :app:lintSideloadDebug :app:lintStoreDebug
          :app:assembleSideloadDebug
          :app:assembleSideloadRelease :app:assembleStoreRelease :app:bundleStoreRelease
      - run: cp android-tv/app/build/outputs/apk/sideload/debug/app-sideload-debug.apk LessonCue-AndroidTV-sideload-debug.apk
      - name: Verify and name signed sideload APK
        run: |
          release_apk="android-tv/app/build/outputs/apk/sideload/release/app-sideload-release.apk"
          test -f "${release_apk}" || { echo "::error::The signed release APK was not produced"; exit 1; }
          apksigner="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "${apksigner}" || { echo "::error::Android apksigner was not found"; exit 1; }
          "${apksigner}" verify --verbose --print-certs "${release_apk}"
          actual_fingerprint="$("${apksigner}" verify --print-certs "${release_apk}" | awk -F': ' '/certificate SHA-256 digest/ && !found { print toupper($NF); found=1 }' | tr -d ':')"
          expected_fingerprint="$(printf '%s' "${LESSONCUE_ANDROID_SIGNING_CERT_SHA256}" | tr '[:lower:]' '[:upper:]' | tr -d ':')"
          test "${actual_fingerprint}" = "${expected_fingerprint}" || { echo "::error::Release APK signing certificate does not match ANDROID_SIGNING_CERT_SHA256"; exit 1; }
          cp "${release_apk}" lessoncue-tv.apk
      - name: Verify and name store packages
        run: |
          store_apk="android-tv/app/build/outputs/apk/store/release/app-store-release.apk"
          store_aab="android-tv/app/build/outputs/bundle/storeRelease/app-store-release.aab"
          test -f "${store_apk}" || { echo "::error::The signed store APK was not produced"; exit 1; }
          test -f "${store_aab}" || { echo "::error::The signed store AAB was not produced"; exit 1; }
          apksigner="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "${apksigner}" verify --verbose --print-certs "${store_apk}"
          jarsigner -verify "${store_aab}"
          cp "${store_apk}" LessonCue-TV-store.apk
          cp "${store_aab}" LessonCue-TV-Google-Play.aab
      - name: Generate signed update metadata
        run: |
          aapt2="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          test -x "${aapt2}" || { echo "::error::Android aapt2 was not found"; exit 1; }
          package_line="$("${aapt2}" dump badging lessoncue-tv.apk | sed -n '1p')"
          version_code="$(printf '%s' "${package_line}" | sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p")"
          version_name="$(printf '%s' "${package_line}" | sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p")"
          test -n "${version_code}" || { echo "::error::Unable to read the APK version code"; exit 1; }
          test -n "${version_name}" || { echo "::error::Unable to read the APK version name"; exit 1; }
          apk_sha256="$(sha256sum lessoncue-tv.apk | awk '{print $1}')"
          apk_size="$(stat -c '%s' lessoncue-tv.apk)"
          apk_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/lessoncue-tv.apk"
          release_notes="$(bash scripts/extract-release-notes.sh --user "${RELEASE_TAG}")"
          jq -n \
            --arg channel "stable" \
            --arg versionName "${version_name}" \
            --arg apkUrl "${apk_url}" \
            --arg sha256 "${apk_sha256}" \
            --arg releaseNotes "${release_notes}" \
            --argjson versionCode "${version_code}" \
            --argjson fileSize "${apk_size}" \
            '{
              schemaVersion: 1,
              channel: $channel,
              versionCode: $versionCode,
              versionName: $versionName,
              apkUrl: $apkUrl,
              sha256: $sha256,
              fileSize: $fileSize,
              mandatory: false,
              minimumSupportedVersionCode: 1,
              releaseNotes: $releaseNotes
            }' > update.json
          printf '%s  %s\n' "${apk_sha256}" "lessoncue-tv.apk" > lessoncue-tv.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: LessonCue-AndroidTV
          path: |
            LessonCue-AndroidTV-sideload-debug.apk
            lessoncue-tv.apk
            lessoncue-tv.apk.sha256
            update.json
            LessonCue-TV-store.apk
            LessonCue-TV-Google-Play.aab

  publish:
    needs: [release-scope, server-linux, server-windows, android]
    if: ${{ always() && inputs.reuse_run_id == '' && needs['release-scope'].result == 'success' && needs['server-linux'].result == 'success' && needs['server-windows'].result == 'success' && (needs['release-scope'].outputs.tv_app_required == 'false' || needs.android.result == 'success') }}
    concurrency:
      group: amazon-appstore-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts from this run
        if: ${{ inputs.reuse_run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Download artifacts from completed run
        if: ${{ inputs.reuse_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
          run-id: ${{ inputs.reuse_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove TV artifacts from server-only release
        if: ${{ needs['release-scope'].outputs.tv_app_required == 'false' }}
        run: |
          rm -f \
            release/LessonCue-AndroidTV-sideload-debug.apk \
            release/LessonCue-TV-Google-Play.aab \
            release/LessonCue-TV-store.apk \
            release/lessoncue-tv.apk \
            release/lessoncue-tv.apk.sha256 \
            release/update.json
      - name: Prepare user-facing release notes
        run: |
          case "${RELEASE_TAG}" in
            v*) ;;
            *) echo "::error::RELEASE_TAG must start with v."; exit 64 ;;
          esac
          bash scripts/extract-release-notes.sh "${RELEASE_TAG}" > release/RELEASE-NOTES.md
          cp CHANGELOG.md release/CHANGELOG.md
          cp installers/linux/install-latest.sh release/install-lessoncue.sh
          # The optional URL shortener is a container stack, while the server
          # itself installs natively. Ship its definition and scripts with the
          # release so a server has them locally instead of needing the repo.
          mkdir -p release/shortener
          cp compose.yaml release/shortener/compose.yaml
          cp scripts/shortener-install.sh release/shortener/install.sh
          cp scripts/shortener-update.sh release/shortener/update.sh
          cp scripts/remove-shlink-web-client.sh release/shortener/remove-shlink-web-client.sh
          cp docs/url-shortener.md release/shortener/README.md
          # The management UI is built locally from the LessonCue-specific
          # Link Shortener Companion fork. Keep its source and license in the
          # signed bundle; servers must not need a second repository checkout.
          cp -R shortener-companion release/shortener/shortener-companion
          tar -czf release/LessonCue-URL-Shortener.tar.gz -C release shortener
          rm -rf release/shortener
      - name: Install checksum-pinned Trivy
        run: bash scripts/install-trivy.sh "${RUNNER_TEMP}/lessoncue-security"
      - name: Generate release SBOM and third-party inventory
        run: |
          "${RUNNER_TEMP}/lessoncue-security/trivy" fs \
            --scanners vuln,license \
            --format spdx-json \
            --output release/LessonCue-SBOM.spdx.json \
            release
          python3 scripts/generate-third-party-notices.py \
            release/LessonCue-SBOM.spdx.json \
            release/THIRD-PARTY-NOTICES.txt
      - name: Require and validate the offline release-signing key
        env:
          RELEASE_SIGNING_KEY_BASE64: ${{ secrets.LESSONCUE_RELEASE_SIGNING_KEY_BASE64 }}
        run: |
          test -n "${RELEASE_SIGNING_KEY_BASE64}" || {
            echo "::error::LESSONCUE_RELEASE_SIGNING_KEY_BASE64 is not configured"
            exit 1
          }
          printf '%s' "${RELEASE_SIGNING_KEY_BASE64}" |
            base64 --decode > "${RUNNER_TEMP}/lessoncue-release-signing-private.pem"
          chmod 0600 "${RUNNER_TEMP}/lessoncue-release-signing-private.pem"
          openssl pkey -in "${RUNNER_TEMP}/lessoncue-release-signing-private.pem" \
            -pubout -out "${RUNNER_TEMP}/lessoncue-release-signing-public.pem"
          expected_fingerprint="dda6fcd087b5b37576aa8d0d84594478103a62aa2e072297b43270fa1908b3e5"
          actual_fingerprint="$(
            openssl pkey -pubin \
              -in "${RUNNER_TEMP}/lessoncue-release-signing-public.pem" \
              -outform DER |
              sha256sum |
              awk '{print $1}'
          )"
          test "${actual_fingerprint}" = "${expected_fingerprint}" || {
            echo "::error::The configured release-signing key does not match LessonCue's pinned public key"
            exit 1
          }
          cmp \
            "${RUNNER_TEMP}/lessoncue-release-signing-public.pem" \
            installers/release-signing-public.pem
      - name: Sign and immediately verify the complete release manifest
        run: |
          (
            cd release
            find . -maxdepth 1 -type f \
              ! -name 'SHA256SUMS' \
              ! -name 'SHA256SUMS.sig' \
              -printf '%f\n' |
              LC_ALL=C sort |
              xargs sha256sum > SHA256SUMS
          )
          openssl pkeyutl -sign \
            -inkey "${RUNNER_TEMP}/lessoncue-release-signing-private.pem" \
            -rawin \
            -in release/SHA256SUMS \
            -out release/SHA256SUMS.sig
          openssl pkeyutl -verify \
            -pubin \
            -inkey installers/release-signing-public.pem \
            -rawin \
            -in release/SHA256SUMS \
            -sigfile release/SHA256SUMS.sig
          (
            cd release
            sha256sum -c SHA256SUMS
          )
      - name: Attest release provenance
        uses: actions/attest@v4
        with:
          subject-path: release/*
      - name: Attest release SBOM
        uses: actions/attest@v4
        with:
          subject-path: release/*
          sbom-path: release/LessonCue-SBOM.spdx.json
      - name: Publish Google Play internal test
        if: ${{ needs['release-scope'].outputs.tv_app_required == 'true' && inputs.reuse_run_id == '' }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.lessoncue.tv
          releaseFiles: release/LessonCue-TV-Google-Play.aab
          # TV-only bundles must use the Android TV form-factor track. The
          # generic mobile track rejects android.software.leanback artifacts.
          # Production publishes the TV-only app to all eligible Google TV /
          # Android TV users through Play's normal review and rollout checks.
          tracks: "tv:production"
          releaseName: ${{ env.RELEASE_TAG }}
          status: completed
      - name: Publish Amazon Appstore
        id: amazon
        if: ${{ needs['release-scope'].outputs.tv_app_required == 'true' }}
        env:
          AMAZON_APP_ID: ${{ secrets.AMAZON_APP_ID }}
          AMAZON_CLIENT_ID: ${{ secrets.AMAZON_CLIENT_ID }}
          AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_CLIENT_SECRET }}
          AMAZON_RELEASE_NOTES_FILE: release/RELEASE-NOTES.md
        run: bash scripts/publish-amazon-appstore.sh release/LessonCue-TV-store.apk
      - name: Document deferred Amazon Appstore submission
        if: ${{ needs['release-scope'].outputs.tv_app_required == 'true' && steps.amazon.outputs.status == 'deferred' }}
        run: |
          cat >> release/RELEASE-NOTES.md <<'EOF'

          ### Amazon Appstore

          The APK is included in this release, but Amazon deferred the upload because the app is currently in review. Amazon does not allow an app to be modified during review. Re-run the **Submit Amazon Appstore APK** workflow for this tag after the review completes.
          EOF
          {
            echo '# Amazon Appstore status'
            echo
            printf 'The %s APK was not changed in Amazon because the app is currently in review. Amazon’s App Submission API returned error_apk_cannot_be_modified. Retry the **Submit Amazon Appstore APK** workflow after Amazon completes that review.\n' "${RELEASE_TAG}"
          } > release/AMAZON-APPSTORE-STATUS.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release/RELEASE-NOTES.md
          generate_release_notes: false
          files: release/*

  publish-reused:
    needs: release-scope
    if: ${{ needs['release-scope'].result == 'success' && github.event.inputs.reuse_run_id != '' }}
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - name: Download verified artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
          run-id: ${{ inputs.reuse_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove TV artifacts from server-only release
        if: ${{ needs['release-scope'].outputs.tv_app_required == 'false' }}
        run: |
          rm -f \
            release/LessonCue-AndroidTV-sideload-debug.apk \
            release/LessonCue-TV-Google-Play.aab \
            release/LessonCue-TV-store.apk \
            release/lessoncue-tv.apk \
            release/lessoncue-tv.apk.sha256 \
            release/update.json
      - name: Prepare user-facing release notes
        run: |
          case "${RELEASE_TAG}" in
            v*) ;;
            *) echo "::error::RELEASE_TAG must start with v."; exit 64 ;;
          esac
          bash scripts/extract-release-notes.sh "${RELEASE_TAG}" > release/RELEASE-NOTES.md
          cp CHANGELOG.md release/CHANGELOG.md
          cp installers/linux/install-latest.sh release/install-lessoncue.sh
          mkdir -p release/shortener
          cp compose.yaml release/shortener/compose.yaml
          cp scripts/shortener-install.sh release/shortener/install.sh
          cp scripts/shortener-update.sh release/shortener/update.sh
          cp scripts/remove-shlink-web-client.sh release/shortener/remove-shlink-web-client.sh
          cp docs/url-shortener.md release/shortener/README.md
          cp -R shortener-companion release/shortener/shortener-companion
          tar -czf release/LessonCue-URL-Shortener.tar.gz -C release shortener
          rm -rf release/shortener
      - name: Install checksum-pinned Trivy
        run: bash scripts/install-trivy.sh "${RUNNER_TEMP}/lessoncue-security"
      - name: Generate release SBOM and third-party inventory
        run: |
          "${RUNNER_TEMP}/lessoncue-security/trivy" fs \
            --scanners vuln,license \
            --format spdx-json \
            --output release/LessonCue-SBOM.spdx.json \
            release
          python3 scripts/generate-third-party-notices.py \
            release/LessonCue-SBOM.spdx.json \
            release/THIRD-PARTY-NOTICES.txt
      - name: Require and validate the offline release-signing key
        env:
          RELEASE_SIGNING_KEY_BASE64: ${{ secrets.LESSONCUE_RELEASE_SIGNING_KEY_BASE64 }}
        run: |
          test -n "${RELEASE_SIGNING_KEY_BASE64}" || {
            echo "::error::LESSONCUE_RELEASE_SIGNING_KEY_BASE64 is not configured"
            exit 1
          }
          printf '%s' "${RELEASE_SIGNING_KEY_BASE64}" |
            base64 --decode > "${RUNNER_TEMP}/lessoncue-release-signing-private.pem"
          chmod 0600 "${RUNNER_TEMP}/lessoncue-release-signing-private.pem"
          openssl pkey -in "${RUNNER_TEMP}/lessoncue-release-signing-private.pem" \
            -pubout -out "${RUNNER_TEMP}/lessoncue-release-signing-public.pem"
          expected_fingerprint="dda6fcd087b5b37576aa8d0d84594478103a62aa2e072297b43270fa1908b3e5"
          actual_fingerprint="$(
            openssl pkey -pubin \
              -in "${RUNNER_TEMP}/lessoncue-release-signing-public.pem" \
              -outform DER |
              sha256sum |
              awk '{print $1}'
          )"
          test "${actual_fingerprint}" = "${expected_fingerprint}" || {
            echo "::error::The configured release-signing key does not match LessonCue's pinned public key"
            exit 1
          }
          cmp \
            "${RUNNER_TEMP}/lessoncue-release-signing-public.pem" \
            installers/release-signing-public.pem
      - name: Sign and immediately verify the complete release manifest
        run: |
          (
            cd release
            find . -maxdepth 1 -type f \
              ! -name 'SHA256SUMS' \
              ! -name 'SHA256SUMS.sig' \
              -printf '%f\n' |
              LC_ALL=C sort |
              xargs sha256sum > SHA256SUMS
          )
          openssl pkeyutl -sign \
            -inkey "${RUNNER_TEMP}/lessoncue-release-signing-private.pem" \
            -rawin \
            -in release/SHA256SUMS \
            -out release/SHA256SUMS.sig
          openssl pkeyutl -verify \
            -pubin \
            -inkey installers/release-signing-public.pem \
            -rawin \
            -in release/SHA256SUMS \
            -sigfile release/SHA256SUMS.sig
          (
            cd release
            sha256sum -c SHA256SUMS
          )
      - name: Attest release provenance
        uses: actions/attest@v4
        with:
          subject-path: release/*
      - name: Attest release SBOM
        uses: actions/attest@v4
        with:
          subject-path: release/*
          sbom-path: release/LessonCue-SBOM.spdx.json
      - name: Record previously completed Google Play publication
        if: ${{ needs['release-scope'].outputs.tv_app_required == 'true' }}
        run: echo "Google Play publication already completed by source run ${SOURCE_RUN_ID}."
        env:
          SOURCE_RUN_ID: ${{ inputs.reuse_run_id }}
      - name: Publish Amazon Appstore
        id: amazon
        if: ${{ needs['release-scope'].outputs.tv_app_required == 'true' }}
        env:
          AMAZON_APP_ID: ${{ secrets.AMAZON_APP_ID }}
          AMAZON_CLIENT_ID: ${{ secrets.AMAZON_CLIENT_ID }}
          AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_CLIENT_SECRET }}
          AMAZON_RELEASE_NOTES_FILE: release/RELEASE-NOTES.md
        run: bash scripts/publish-amazon-appstore.sh release/LessonCue-TV-store.apk
      - name: Document deferred Amazon Appstore submission
        if: ${{ needs['release-scope'].outputs.tv_app_required == 'true' && steps.amazon.outputs.status == 'deferred' }}
        run: |
          cat >> release/RELEASE-NOTES.md <<'EOF'

          ### Amazon Appstore

          The APK is included in this release, but Amazon deferred the upload because the app is currently in review. Amazon does not allow an app to be modified during review. Re-run the **Submit Amazon Appstore APK** workflow for this tag after the review completes.
          EOF
          {
            echo '# Amazon Appstore status'
            echo
            printf 'The %s APK was not changed in Amazon because the app is currently in review. Amazon’s App Submission API returned error_apk_cannot_be_modified. Retry the **Submit Amazon Appstore APK** workflow after Amazon completes that review.\n' "${RELEASE_TAG}"
          } > release/AMAZON-APPSTORE-STATUS.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release/RELEASE-NOTES.md
          generate_release_notes: false
          files: release/*
