services:
  lessoncue:
    build:
      context: .
      dockerfile: server/LessonCue.Server/Dockerfile
    image: lessoncue/server:local
    container_name: lessoncue
    restart: unless-stopped
    ports:
      - "${LESSONCUE_HTTP_PORT:-80}:8080"
    volumes:
      - "${LESSONCUE_DATA_PATH:-./lessoncue-data}:/data"
    read_only: true
    mem_limit: 4g
    cpus: "${LESSONCUE_CPUS:-2.0}"
    pids_limit: 160
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=1g
    environment:
      # The app listens on the unprivileged container port while reporting the
      # externally published port in discovery metadata and Settings.
      ASPNETCORE_URLS: http://0.0.0.0:8080
      LESSONCUE_DATA_PATH: /data
      LESSONCUE_HTTP_PORT: "${LESSONCUE_HTTP_PORT:-80}"
      # Docker's default seccomp profile commonly blocks the nested user and
      # mount namespaces Bubblewrap needs. The outer container already supplies
      # the isolation boundary, so Docker defaults to the constrained worker
      # fallback; set LESSONCUE_MEDIA_WORKER_SKIP_SANDBOX=0 only on a host that
      # has explicitly enabled nested namespaces.
      LESSONCUE_MEDIA_WORKER_SKIP_SANDBOX: "${LESSONCUE_MEDIA_WORKER_SKIP_SANDBOX:-1}"
      LESSONCUE_SERVER_NAME: "${LESSONCUE_SERVER_NAME:-LessonCue}"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # The link shortener. Optional: bring it up with
  #   docker compose --profile shortener up -d
  # and leave it out entirely on installations that do not use short links.
  #
  # Two hostnames point here, and they do different jobs:
  #   SHORT_DOMAIN        the public short domain, e.g. chroc.cc. Route it to
  #                       lessoncue, which answers "/" and hands every other
  #                       path to this container.
  #   SHORTENER_HOSTNAME  the shortener's own address, e.g. short.chroc.cc.
  #                       Route it straight here for the admin UI and API.
  shlink:
    image: ghcr.io/shlinkio/shlink:4.4.6
    container_name: lessoncue-shlink
    profiles: ["shortener"]
    restart: unless-stopped
    ports:
      - "${SHORTENER_HTTP_PORT:-8081}:8080"
    volumes:
      - "${SHORTENER_DATA_PATH:-./shlink-data}:/etc/shlink/data"
    environment:
      # The domain short links are minted on. LessonCue fronts this hostname
      # and forwards everything but the bare root here, with the original Host
      # intact so multi-domain resolution still works.
      DEFAULT_DOMAIN: "${SHORT_DOMAIN:?set SHORT_DOMAIN, for example chroc.cc}"
      IS_HTTPS_ENABLED: "true"
      # SQLite keeps this a single-box install like the rest of LessonCue.
      DB_DRIVER: sqlite
      GEOLITE_LICENSE_KEY: "${SHORTENER_GEOLITE_KEY:-}"
      # The bare root is LessonCue's to answer, so Shlink never needs an
      # opinion about it. Anything that does reach here without a short code
      # is a genuine miss.
      DEFAULT_INVALID_SHORT_URL_REDIRECT: "${SHORTENER_INVALID_REDIRECT:-}"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/rest/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
