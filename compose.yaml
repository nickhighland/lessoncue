services:
  lessoncue:
    build:
      context: .
      dockerfile: server/LessonCue.Server/Dockerfile
    image: lessoncue/server:local
    container_name: lessoncue
    restart: unless-stopped
    ports:
      - "${LESSONCUE_HTTP_PORT:-80}:8080"
    volumes:
      - "${LESSONCUE_DATA_PATH:-./lessoncue-data}:/data"
    read_only: true
    mem_limit: 4g
    cpus: "${LESSONCUE_CPUS:-2.0}"
    pids_limit: 160
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=1g
    environment:
      # The app listens on the unprivileged container port while reporting the
      # externally published port in discovery metadata and Settings.
      ASPNETCORE_URLS: http://0.0.0.0:8080
      LESSONCUE_DATA_PATH: /data
      LESSONCUE_HTTP_PORT: "${LESSONCUE_HTTP_PORT:-80}"
      # Docker's default seccomp profile commonly blocks the nested user and
      # mount namespaces Bubblewrap needs. The outer container already supplies
      # the isolation boundary, so Docker defaults to the constrained worker
      # fallback; set LESSONCUE_MEDIA_WORKER_SKIP_SANDBOX=0 only on a host that
      # has explicitly enabled nested namespaces.
      LESSONCUE_MEDIA_WORKER_SKIP_SANDBOX: "${LESSONCUE_MEDIA_WORKER_SKIP_SANDBOX:-1}"
      LESSONCUE_SERVER_NAME: "${LESSONCUE_SERVER_NAME:-LessonCue}"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ------------------------------------------------------------------------
  # Optional URL shortener. Nothing below starts unless it is asked for:
  #
  #   docker compose --profile shortener up -d
  #
  # Two public hostnames point here, and they do different jobs. Route the
  # short domain to `shlink`, and the management host to `shlink-web-client`.
  # Both go through the same Cloudflare Tunnel that already serves LessonCue.
  # ------------------------------------------------------------------------

  shlink-db:
    image: postgres:17.6-alpine
    container_name: lessoncue-shlink-db
    profiles: ["shortener"]
    restart: unless-stopped
    # Never published. The database is reachable only from the compose network,
    # and never through the tunnel.
    expose:
      - "5432"
    volumes:
      - "${SHORTENER_DB_PATH:-./shortener-data/postgres}:/var/lib/postgresql/data"
    environment:
      POSTGRES_DB: shlink
      POSTGRES_USER: shlink
      POSTGRES_PASSWORD_FILE: /run/secrets/shortener_db_password
    secrets:
      - shortener_db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shlink -d shlink"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s

  shlink:
    image: ghcr.io/shlinkio/shlink:4.4.6
    container_name: lessoncue-shlink
    profiles: ["shortener"]
    restart: unless-stopped
    depends_on:
      shlink-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SHORTENER_HTTP_PORT:-8081}:8080"
    environment:
      # The domain short links are minted on. Supplied by the operator; nothing
      # in LessonCue assumes any particular value.
      DEFAULT_DOMAIN: "${SHORT_DOMAIN:?set SHORT_DOMAIN, for example go.example.org}"
      IS_HTTPS_ENABLED: "true"
      # Loose mode is what makes a code typed as q7z6 reach the game shown as
      # Q7Z6 on the television.
      SHORT_URL_MODE: loose
      DB_DRIVER: postgres
      DB_HOST: shlink-db
      DB_NAME: shlink
      DB_USER: shlink
      DB_PASSWORD_FILE: /run/secrets/shortener_db_password
      # LessonCue's own credential, used only for provisioning and repair.
      INITIAL_API_KEY_FILE: /run/secrets/shortener_integration_key
      # Where the bare short domain goes. Empty leaves the shortener's own
      # not-found page in place, which is the default.
      DEFAULT_BASE_URL_REDIRECT: "${SHORT_DOMAIN_ROOT_REDIRECT:-}"
      GEOLITE_LICENSE_KEY: "${SHORTENER_GEOLITE_KEY:-}"
    secrets:
      - shortener_db_password
      - shortener_integration_key
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/rest/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  shlink-web-client:
    image: ghcr.io/shlinkio/shlink-web-client:4.4.0
    container_name: lessoncue-shlink-web
    profiles: ["shortener"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SHORTENER_UI_PORT:-8082}:8080"
    # Deliberately given no server list and no API key. The client is a static
    # page served to a browser, so anything handed to it here would be handed
    # to whoever opens it. An administrator connects it with their own key.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

secrets:
  shortener_db_password:
    file: "${SHORTENER_DB_PASSWORD_FILE:-./shortener-data/db-password}"
  shortener_integration_key:
    file: "${SHORTENER_INTEGRATION_KEY_FILE:-./shortener-data/integration-key}"
