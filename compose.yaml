services:
  lessoncue:
    build:
      context: .
      dockerfile: server/LessonCue.Server/Dockerfile
    image: lessoncue/server:local
    container_name: lessoncue
    restart: unless-stopped
    user: "${LESSONCUE_UID:-10001}:${LESSONCUE_GID:-10001}"
    ports:
      - "${LESSONCUE_HTTP_PORT:-80}:8080"
    volumes:
      - "${LESSONCUE_DATA_PATH:-./lessoncue-data}:/data"
    read_only: true
    mem_limit: 4g
    cpus: "${LESSONCUE_CPUS:-2.0}"
    pids_limit: 160
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=1g
    environment:
      # The app listens on the unprivileged container port while reporting the
      # externally published port in discovery metadata and Settings.
      ASPNETCORE_URLS: http://0.0.0.0:8080
      LESSONCUE_DATA_PATH: /data
      LESSONCUE_HTTP_PORT: "${LESSONCUE_HTTP_PORT:-80}"
      # Match the owner chosen by the shortener installer when this compose
      # file is used outside the native Linux package. The native installer
      # keeps the documented 10001:10001 default.
      LESSONCUE_UID: "${LESSONCUE_UID:-10001}"
      LESSONCUE_GID: "${LESSONCUE_GID:-10001}"
      # Docker's default seccomp profile commonly blocks the nested user and
      # mount namespaces Bubblewrap needs. The outer container already supplies
      # the isolation boundary, so Docker defaults to the constrained worker
      # fallback; set LESSONCUE_MEDIA_WORKER_SKIP_SANDBOX=0 only on a host that
      # has explicitly enabled nested namespaces.
      LESSONCUE_MEDIA_WORKER_SKIP_SANDBOX: "${LESSONCUE_MEDIA_WORKER_SKIP_SANDBOX:-1}"
      LESSONCUE_SERVER_NAME: "${LESSONCUE_SERVER_NAME:-LessonCue}"
      # Passed in so the tunnel instructions name the ports actually published,
      # rather than the defaults this file happens to use.
      SHORTENER_HTTP_PORT: "${SHORTENER_HTTP_PORT:-8081}"
      SHORTENER_UI_PORT: "${SHORTENER_UI_PORT:-8082}"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ------------------------------------------------------------------------
  # Optional URL shortener. Nothing below starts unless it is asked for:
  #
  #   docker compose --profile shortener up -d
  #
  # Two public hostnames point here, and they do different jobs. Route the
  # short domain to `shlink`, and the management host to `shlink-web-client`.
  # Both go through the same Cloudflare Tunnel that already serves LessonCue.
  # ------------------------------------------------------------------------

  shlink-db:
    image: postgres:17.6-alpine
    container_name: lessoncue-shlink-db
    profiles: ["shortener"]
    restart: unless-stopped
    # Never published. The database is reachable only from the compose network,
    # and never through the tunnel.
    expose:
      - "5432"
    volumes:
      - "${SHORTENER_DB_PATH:-./shortener-data/postgres}:/var/lib/postgresql/data"
    environment:
      POSTGRES_DB: shlink
      POSTGRES_USER: shlink
      POSTGRES_PASSWORD_FILE: /run/secrets/shortener_db_password
    secrets:
      - shortener_db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shlink -d shlink"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s

  shlink:
    # Pinned, never `latest`: an unattended major bump would migrate the
    # database out from under the links the organization depends on.
    image: "${SHORTENER_IMAGE:-ghcr.io/shlinkio/shlink:4.4.6}"
    container_name: lessoncue-shlink
    profiles: ["shortener"]
    restart: unless-stopped
    depends_on:
      shlink-db:
        condition: service_healthy
    ports:
      # Loopback by default, so the tunnel is the only way in. Set
      # SHORTENER_BIND=0.0.0.0 to also reach it from the local network -- useful
      # while setting up, and a deliberate choice rather than the default.
      - "${SHORTENER_BIND:-127.0.0.1}:${SHORTENER_HTTP_PORT:-8081}:8080"
    environment:
      # The domain short links are minted on. Supplied by the operator; nothing
      # in LessonCue assumes any particular value.
      DEFAULT_DOMAIN: "${SHORT_DOMAIN:?set SHORT_DOMAIN, for example go.example.org}"
      IS_HTTPS_ENABLED: "true"
      # Loose mode is what makes a code typed as q7z6 reach the game shown as
      # Q7Z6 on the television.
      SHORT_URL_MODE: loose
      DB_DRIVER: postgres
      DB_HOST: shlink-db
      DB_NAME: shlink
      DB_USER: shlink
      DB_PASSWORD_FILE: /run/secrets/shortener_db_password
      # LessonCue's own credential, used only for provisioning and repair.
      INITIAL_API_KEY_FILE: /run/secrets/shortener_integration_key
      # Where the bare short domain goes. Empty leaves the shortener's own
      # not-found page in place, which is the default.
      DEFAULT_BASE_URL_REDIRECT: "${SHORT_DOMAIN_ROOT_REDIRECT:-}"
      GEOLITE_LICENSE_KEY: "${SHORTENER_GEOLITE_KEY:-}"
    secrets:
      - shortener_db_password
      - shortener_integration_key
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/rest/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  shlink-web-client:
    # This is the LessonCue Link Shortener Companion, a customized fork of the
    # Shlink web client. It is built from the pinned source shipped beside this
    # compose file instead of loading a browser-only Shlink image.
    build:
      context: ./shortener-companion
      dockerfile: Dockerfile
    image: "${SHORTENER_UI_IMAGE:-lessoncue/link-shortener-companion:local}"
    container_name: lessoncue-shlink-web
    profiles: ["shortener"]
    restart: unless-stopped
    depends_on:
      shlink:
        condition: service_healthy
    ports:
      # The companion authenticates visitors itself. Keep the published port
      # on loopback so the Cloudflare Tunnel remains the normal public route.
      - "${SHORTENER_UI_BIND:-127.0.0.1}:${SHORTENER_UI_PORT:-8082}:8080"
    user: "${SHORTENER_UI_UID:-10001}:${SHORTENER_UI_GID:-10001}"
    environment:
      # The API key is read by PHP from a Docker secret and is never placed in
      # the HTML or JavaScript sent to a browser.
      SHLINK_API_URL: "http://shlink:8080/rest/v3"
      SHLINK_API_KEY_FILE: /run/secrets/shortener_console_key
      SHLINK_SHORT_URL_BASE: "https://${SHORT_DOMAIN:?set SHORT_DOMAIN}/"
      COMPANION_APP_NAME: "${SHORTENER_UI_APP_NAME:-Link Shortener}"
      # LessonCue writes a JSON reset request here when an administrator sets
      # the shared password. The companion consumes it into ui-config.json;
      # later changes made in Access & brand remain effective.
      COMPANION_PASSWORD_RESET_FILE: /var/lib/companion-control/password-reset
    secrets:
      - shortener_console_key
    volumes:
      - "${LESSONCUE_DATA_PATH:-./lessoncue-data}/config/shortener/companion-data:/var/www/companion/data"
      - "${LESSONCUE_DATA_PATH:-./lessoncue-data}/config/shortener/companion-control:/var/lib/companion-control"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    mem_limit: 256m
    cpus: "0.50"
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

secrets:
  shortener_db_password:
    file: "${SHORTENER_DB_PASSWORD_FILE:-./shortener-data/db-password}"
  shortener_integration_key:
    file: "${SHORTENER_INTEGRATION_KEY_FILE:-./shortener-data/integration-key}"
  shortener_console_key:
    file: "${LESSONCUE_DATA_PATH:-./lessoncue-data}/config/shortener/console-key"
