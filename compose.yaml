services:
  lessoncue:
    build:
      context: .
      dockerfile: server/LessonCue.Server/Dockerfile
    image: lessoncue/server:local
    container_name: lessoncue
    restart: unless-stopped
    ports:
      - "${LESSONCUE_HTTP_PORT:-80}:8080"
    volumes:
      - "${LESSONCUE_DATA_PATH:-./lessoncue-data}:/data"
    read_only: true
    mem_limit: 4g
    cpus: "${LESSONCUE_CPUS:-2.0}"
    pids_limit: 160
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=1g
    environment:
      # The app listens on the unprivileged container port while reporting the
      # externally published port in discovery metadata and Settings.
      ASPNETCORE_URLS: http://0.0.0.0:8080
      LESSONCUE_DATA_PATH: /data
      LESSONCUE_HTTP_PORT: "${LESSONCUE_HTTP_PORT:-80}"
      # Docker's default seccomp profile commonly blocks the nested user and
      # mount namespaces Bubblewrap needs. The outer container already supplies
      # the isolation boundary, so Docker defaults to the constrained worker
      # fallback; set LESSONCUE_MEDIA_WORKER_SKIP_SANDBOX=0 only on a host that
      # has explicitly enabled nested namespaces.
      LESSONCUE_MEDIA_WORKER_SKIP_SANDBOX: "${LESSONCUE_MEDIA_WORKER_SKIP_SANDBOX:-1}"
      LESSONCUE_SERVER_NAME: "${LESSONCUE_SERVER_NAME:-LessonCue}"
      # Passed in so the tunnel instructions name the ports actually published,
      # rather than the defaults this file happens to use.
      SHORTENER_HTTP_PORT: "${SHORTENER_HTTP_PORT:-8081}"
      SHORTENER_UI_PORT: "${SHORTENER_UI_PORT:-8082}"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ------------------------------------------------------------------------
  # Optional URL shortener. Nothing below starts unless it is asked for:
  #
  #   docker compose --profile shortener up -d
  #
  # Two public hostnames point here, and they do different jobs. Route the
  # short domain to `shlink`, and the management host to `shlink-web-client`.
  # Both go through the same Cloudflare Tunnel that already serves LessonCue.
  # ------------------------------------------------------------------------

  shlink-db:
    image: postgres:17.6-alpine
    container_name: lessoncue-shlink-db
    profiles: ["shortener"]
    restart: unless-stopped
    # Never published. The database is reachable only from the compose network,
    # and never through the tunnel.
    expose:
      - "5432"
    volumes:
      - "${SHORTENER_DB_PATH:-./shortener-data/postgres}:/var/lib/postgresql/data"
    environment:
      POSTGRES_DB: shlink
      POSTGRES_USER: shlink
      POSTGRES_PASSWORD_FILE: /run/secrets/shortener_db_password
    secrets:
      - shortener_db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shlink -d shlink"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s

  shlink:
    # Pinned, never `latest`: an unattended major bump would migrate the
    # database out from under the links the organization depends on.
    image: "${SHORTENER_IMAGE:-ghcr.io/shlinkio/shlink:4.4.6}"
    container_name: lessoncue-shlink
    profiles: ["shortener"]
    restart: unless-stopped
    depends_on:
      shlink-db:
        condition: service_healthy
    ports:
      # Loopback by default, so the tunnel is the only way in. Set
      # SHORTENER_BIND=0.0.0.0 to also reach it from the local network -- useful
      # while setting up, and a deliberate choice rather than the default.
      - "${SHORTENER_BIND:-127.0.0.1}:${SHORTENER_HTTP_PORT:-8081}:8080"
    environment:
      # The domain short links are minted on. Supplied by the operator; nothing
      # in LessonCue assumes any particular value.
      DEFAULT_DOMAIN: "${SHORT_DOMAIN:?set SHORT_DOMAIN, for example go.example.org}"
      IS_HTTPS_ENABLED: "true"
      # Loose mode is what makes a code typed as q7z6 reach the game shown as
      # Q7Z6 on the television.
      SHORT_URL_MODE: loose
      DB_DRIVER: postgres
      DB_HOST: shlink-db
      DB_NAME: shlink
      DB_USER: shlink
      DB_PASSWORD_FILE: /run/secrets/shortener_db_password
      # LessonCue's own credential, used only for provisioning and repair.
      INITIAL_API_KEY_FILE: /run/secrets/shortener_integration_key
      # Where the bare short domain goes. Empty leaves the shortener's own
      # not-found page in place, which is the default.
      DEFAULT_BASE_URL_REDIRECT: "${SHORT_DOMAIN_ROOT_REDIRECT:-}"
      GEOLITE_LICENSE_KEY: "${SHORTENER_GEOLITE_KEY:-}"
    secrets:
      - shortener_db_password
      - shortener_integration_key
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/rest/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  shlink-web-client:
    # Swappable, like the API image above. Shlink and its console are MIT, so a
    # fork built into your own image drops in here -- set SHORTENER_UI_IMAGE in
    # .env, which the installer preserves.
    image: "${SHORTENER_UI_IMAGE:-ghcr.io/shlinkio/shlink-web-client:4.4.0}"
    container_name: lessoncue-shlink-web
    profiles: ["shortener"]
    restart: unless-stopped
    expose:
      # Reached only through the password gate in front of it, which is what
      # the management hostname actually points at.
      - "8080"
    environment:
      # The server is named and addressed for you, so the console opens on the
      # right Shlink with only the key left to supply.
      SHLINK_SERVER_NAME: "${SHORT_DOMAIN:-LessonCue}"
      SHLINK_SERVER_URL: "https://${SHORT_DOMAIN:?set SHORT_DOMAIN}"
      # Deliberately empty. This console is published on its own hostname, and
      # a key set here is readable by anyone who loads the page -- it would be
      # short-link admin for the whole domain, handed out. LessonCue shows the
      # key to a signed-in administrator instead.
      #
      # Set SHORTENER_UI_API_KEY only when the management hostname is behind
      # Cloudflare Access or an equivalent, and you accept the trade.
      SHLINK_SERVER_API_KEY: "${SHORTENER_UI_API_KEY:-}"
    healthcheck:
      # 127.0.0.1, not localhost: inside these images localhost resolves to ::1
      # alone while the server binds IPv4, so wget -- which does not fall back
      # the way curl does -- reported a perfectly healthy console as down.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # A password in front of the console. The console is a page in a browser with
  # no login of its own, so on a public hostname anyone who finds the address is
  # already inside it. This asks for a password first, and LessonCue sets it.
  #
  # The configuration is written here at start-up rather than shipped as a
  # second file: the release bundle and the repository lay their files out
  # differently, and one path assumed wrong has cost this feature enough
  # already. Note $$ -- compose would otherwise read $host as a variable.
  shlink-web-gate:
    image: nginx:1.27-alpine
    container_name: lessoncue-shlink-gate
    profiles: ["shortener"]
    restart: unless-stopped
    depends_on:
      - shlink-web-client
    ports:
      # Loopback is enough: the tunnel connector runs on this host, so it
      # reaches the gate here and publishes it on the management hostname.
      - "${SHORTENER_UI_BIND:-127.0.0.1}:${SHORTENER_UI_PORT:-8082}:8080"
    volumes:
      # Read-only, and written by LessonCue when an administrator sets it.
      - "${SHORTENER_CONSOLE_PASSWORD_FILE:-./shortener-data/console-password}:/run/console-password:ro"
    command:
      - sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'CONF'
        server {
          listen 8080;
          server_name _;

          # Unauthenticated on purpose, and it reveals nothing: the container
          # healthcheck has to reach something that is not behind the password.
          location = /healthz { auth_basic off; return 200 "ok\n"; }

          location / {
            auth_basic "LessonCue short links";
            auth_basic_user_file /run/console-password;
            proxy_pass http://shlink-web-client:8080;
            proxy_set_header Host $$host;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
          }
        }
        CONF
        exec nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
      - /var/cache/nginx:rw,nosuid,nodev,size=16m
      - /var/run:rw,noexec,nosuid,nodev,size=4m
      - /etc/nginx/conf.d:rw,noexec,nosuid,nodev,size=1m
    mem_limit: 128m
    cpus: "0.25"
    pids_limit: 64
    security_opt:
      - no-new-privileges:true

secrets:
  shortener_db_password:
    file: "${SHORTENER_DB_PASSWORD_FILE:-./shortener-data/db-password}"
  shortener_integration_key:
    file: "${SHORTENER_INTEGRATION_KEY_FILE:-./shortener-data/integration-key}"
